<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='820' viewBox='0 0 1100 820'><rect width='1100' height='820' fill='#fbfaf7'/><text x='50' y='42' font-family='Arial' font-size='26' font-weight='bold'>A. oryzae secretory machinery: primary pathway placement</text><text x='50' y='70' font-family='Arial' font-size='14' fill='#444'>Each box is a stage of the secretion pathway. "Responsive" = changed significantly in all three</text><text x='50' y='90' font-family='Arial' font-size='14' fill='#444'>alpha-amylase-overproducing strains (Liu 2014, adj. p &lt; 0.05).</text><g><title>Translocation (tc)</title><rect x='50' y='120' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#456' /><text x='64' y='141' font-family='Arial' font-size='13' font-weight='bold'><tspan x='64' dy='0'>Translocation (tc)</tspan></text><text x='64' y='190' font-family='Arial' font-size='14'>20 genes</text><text x='176' y='190' font-family='Arial' font-size='13' fill='#a34b20'>9 responsive</text></g><g><title>Dolichol-linked glycan assembly</title><rect x='315' y='120' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#456' /><text x='329' y='141' font-family='Arial' font-size='13' font-weight='bold'><tspan x='329' dy='0'>Dolichol-linked glycan</tspan><tspan x='329' dy='16'>assembly</tspan></text><text x='329' y='190' font-family='Arial' font-size='14'>14 genes</text><text x='441' y='190' font-family='Arial' font-size='13' fill='#a34b20'>4 responsive</text></g><g><title>ER N-glycosylation</title><rect x='580' y='120' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#456' /><text x='594' y='141' font-family='Arial' font-size='13' font-weight='bold'><tspan x='594' dy='0'>ER N-glycosylation</tspan></text><text x='594' y='190' font-family='Arial' font-size='14'>11 genes</text><text x='706' y='190' font-family='Arial' font-size='13' fill='#a34b20'>4 responsive</text></g><g><title>Protein folding</title><rect x='845' y='120' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#45