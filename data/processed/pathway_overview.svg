b20'>0 responsive</text></g><g><title>Putative mitochondrial protein</title><rect x='315' y='592' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#456' /><text x='329' y='613' font-family='Arial' font-size='13' font-weight='bold'><tspan x='329' dy='0'>Putative mitochondrial</tspan><tspan x='329' dy='16'>protein</tspan></text><text x='329' y='662' font-family='Arial' font-size='14'>1 genes</text><text x='441' y='662' font-family='Arial' font-size='13' fill='#a34b20'>0 responsive</text></g><g><title>Mitochondrial m-AAA protease</title><rect x='580' y='592' width='235' height='92' rx='8' fill='#dbe9e4' stroke='#456' /><text x='594' y='613' font-family='Arial' font-size='13' font-weight='bold'><tspan x='594' dy='0'>Mitochondrial m-AAA protease</tspan></text><text x='594' y='662' font-family='Arial' font-size='14'>1 genes</text><text x='706' y='662' font-family='Arial' font-size='13' fill='#a34b20'>0 responsive</text></g><g><title>Unassigned / uncertain</title><rect x='845' y='592' width='235' height='92' rx='8' fill='#f5d8cf' stroke='#456'  stroke-dasharray='7 5'/><text x='859' y='613' font-family='Arial' font-size='13' font-weight='bold'><tspan x='859' dy='0'>Unassigned / uncertain</tspan></text><text x='859' y='662' font-family='Arial' font-size='14'>122 genes</text><text x='971' y='662' font-family='Arial' font-size='13' fill='#a34b20'>0 responsive</text></g><text x='50' y='760' font-family='Arial' font-size='12' fill='#555'>369 machinery genes; 247 placed; 122 unassigned; 51 responsive. Liu et al. 2014, doi:10.1186/1752-0509-8-73. Build 2026-07-29.</text><text x='50' y='785' font-family='Arial' font-size='12' fill='#7a4b20'>Low-confidence placements are inferred rather than assigned by Liu; secondary roles are retained in gene_subsystems.csv.</text></svg>